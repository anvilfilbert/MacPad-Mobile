name: Bug report
description: Report a reproducible MacPad Mobile problem without private content.
title: "Bug: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include Document content, credentials, private paths, personal information, or vulnerability details.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented File names and redacted sample content.
      placeholder: |
        1. Open …
        2. Choose …
        3. Observe …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone or iPad model
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS or iPadOS version
      placeholder: 18.x
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MacPad Mobile version and build
      description: If available in the installed build.
  - type: input
    id: provider
    attributes:
      label: File provider or sending app
      description: Include its version when the problem involves Files or External Open.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Attach only fully redacted screenshots or diagnostics. Do not report security vulnerabilities here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed Document content, credentials, private paths, and personal information.
          required: true
        - label: This report does not describe a security vulnerability.
          required: true
