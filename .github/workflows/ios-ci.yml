name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Generate Swift documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate PhonePadCore documentation
        uses: SwiftDocOrg/swift-doc@f935ebfe524a0ff27bda07dadc3662e3e45b5125 # 1.0.0-rc.1
        with:
          inputs: PhonePadCore
          module-name: PhonePadCore
          minimum-access-level: internal
          output: .build/swift-doc/PhonePadCore

      - name: Generate application documentation
        uses: SwiftDocOrg/swift-doc@f935ebfe524a0ff27bda07dadc3662e3e45b5125 # 1.0.0-rc.1
        with:
          inputs: PhonePad
          module-name: PhonePad
          minimum-access-level: internal
          output: .build/swift-doc/PhonePad

      - name: Upload generated documentation
        uses: actions/upload-artifact@v6
        with:
          name: swift-documentation-${{ github.run_id }}
          path: .build/swift-doc
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    name: Release build and unit tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app

      - name: Report toolchain
        run: xcodebuild -version

      - name: Build Release with warnings as errors
        run: >-
          xcodebuild
          -quiet
          -project PhonePad.xcodeproj
          -scheme PhonePad
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build

      - name: Run unit and integration tests
        run: >-
          xcodebuild
          -quiet
          -project PhonePad.xcodeproj
          -scheme PhonePad
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -resultBundlePath '${{ runner.temp }}/PhonePadTests.xcresult'
          test
          -only-testing:PhonePadTests

      - name: Upload failed test result
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: PhonePadTests-${{ github.run_id }}
          path: ${{ runner.temp }}/PhonePadTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
